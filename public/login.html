<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf1ce">
  <title>Sign in — Reel Recipes</title>
  <meta name="description" content="Sign in to Reel Recipes to save recipes privately to your account.">
  <link rel="stylesheet" href="/styles.css?v=8">
</head>
<body>
  <div class="decor" aria-hidden="true">
    <span class="d-circle"></span>
    <span class="d-arch"></span>
    <span class="d-leaf"></span>
  </div>

  <header class="topbar">
    <a class="top-link" href="/">← Reel Recipes</a>
  </header>

  <main>
    <h1 id="hero" class="hero">Welcome back<span class="qm">.</span></h1>
    <p id="sub" class="sub">Sign in to save recipes privately to your account — on the web and from the iPhone Shortcut.</p>

    <form id="auth-form" novalidate>
      <label class="field-label" for="email">Email</label>
      <input id="email" name="email" class="text-field" type="email" inputmode="email"
             autocomplete="email" autocapitalize="off" autocorrect="off" spellcheck="false"
             placeholder="you@example.com" required>

      <label class="field-label" for="password">Password</label>
      <input id="password" name="password" class="text-field" type="password"
             autocomplete="current-password" placeholder="At least 8 characters" required>

      <div id="error-box" class="msg-error" role="alert" hidden></div>

      <button id="submit" type="submit" class="btn btn-primary">Sign in</button>
    </form>

    <p class="auth-switch">
      <span id="switch-text">New here?</span>
      <button type="button" id="switch-btn" class="link-btn">Create an account</button>
    </p>
  </main>

  <footer>
    <a class="footer-link" href="/shortcut">iPhone Shortcut setup</a>
  </footer>

  <script src="/auth.js?v=8"></script>
</body>
</html>
